[project]
name = "specramo"
version = "0.0.1"
description = "Spec-driven development toolkit that ships work as reviewable, PR-sized phases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
specramo = "specramo_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specramo_cli"]
